name: Check repo
on:
  push:
    branches: ["**"]
    paths: ["src/**", "notebooks/**", "config/**", "tools/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static check (imports resolve, notebooks parse)
        run: python tools/check_repo.py
