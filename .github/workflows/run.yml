name: Run notebooks on Kaggle

# This job only STARTS the Kaggle GPU run and exits (about 1-3 minutes of Actions time).
# The Kaggle kernel executes the notebook and pushes the finished notebook back to
# runs/<run_id>/<notebook>/ by itself, so no Actions minutes are spent while it runs.

on:
  workflow_dispatch:
    inputs:
      notebooks:
        description: 'Notebook ids, comma separated, or "all" (see config/project.json)'
        default: 'all'
        required: true
      label:
        description: 'Optional label appended to the run id (e.g. "confirmatory")'
        default: ''
      on_failure:
        description: 'When running several notebooks: continue or stop after a failure'
        type: choice
        options: [continue, stop]
        default: continue
      lanes:
        description: 'Parallel Kaggle sessions (max 2 GPU sessions per account)'
        type: choice
        options: ['1', '2']
        default: '1'
      resume_from:
        description: 'Seed the working dir from an earlier attempt, e.g. failed/<run_id>/<notebook> (single notebook only)'
        default: ''
      selfcheck:
        description: 'Only run the CPU self-check on Kaggle (secrets, tokens, internet) - no notebook, no GPU'
        type: boolean
        default: false
      run_id:
        description: '(internal / advanced) reuse an existing run id'
        default: ''
      slot:
        description: '(internal) kernel slot a or b'
        default: ''
      pin_sha:
        description: '(internal) commit the whole run is pinned to'
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: kaggle-launch-${{ inputs.slot || 'a' }}
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pin_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q "kaggle>=1.7"
      - name: Start Kaggle run
        env:
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          RUNTIME_GH_TOKEN: ${{ secrets.RUNTIME_GH_TOKEN }}
          RUNTIME_HF_TOKEN: ${{ secrets.RUNTIME_HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          IN_NOTEBOOKS: ${{ inputs.notebooks }}
          IN_LABEL: ${{ inputs.label }}
          IN_ON_FAILURE: ${{ inputs.on_failure }}
          IN_LANES: ${{ inputs.lanes }}
          IN_RESUME: ${{ inputs.resume_from }}
          IN_RUN_ID: ${{ inputs.run_id }}
          IN_SLOT: ${{ inputs.slot }}
          IN_SELFCHECK: ${{ inputs.selfcheck }}
          IN_PIN: ${{ inputs.pin_sha }}
        run: |
          args=(launch --notebooks "$IN_NOTEBOOKS" --label "$IN_LABEL" --on-failure "${IN_ON_FAILURE:-continue}" \
                --lanes "${IN_LANES:-1}" --resume-from "$IN_RESUME" --run-id "$IN_RUN_ID" --slot "$IN_SLOT" \
                --sha "${IN_PIN:-$GITHUB_SHA}" --branch "$GITHUB_REF_NAME")
          if [ "$IN_SELFCHECK" = "true" ]; then args+=(--selfcheck); fi
          python tools/launch.py "${args[@]}"
